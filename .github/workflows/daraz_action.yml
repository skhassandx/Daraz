name: Daraz Coin Claim Automation

on:
  workflow_dispatch: # আপাতত টেস্ট করার জন্য শুধু ম্যানুয়াল রান অপশন রাখলাম

permissions:
  contents: write

jobs:
  run-daraz-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Daraz Script
        run: python daraz_claim.py

      - name: Commit and push screenshot
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add daraz_coin_page.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-added Daraz screenshot" && git push)
