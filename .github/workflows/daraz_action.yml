name: Daraz Coin Claim Automation

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬:১৩ মিনিটে (UTC 00:13) রান করবে
    - cron: '13 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daraz-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Run Daraz Script
        run: python daraz_claim.py

      - name: Commit and push screenshot
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-added Daraz mission screenshots" && git push)
